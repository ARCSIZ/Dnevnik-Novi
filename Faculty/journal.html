  const BACK='../Students/diary.html?view=apps';
  const goBack=()=>{ location.href=BACK; };
  ['btnBack','btnBack2','btnBack3'].forEach(id=>{const b=$(id); if(b) b.addEventListener('click',goBack);});
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') goBack(); });
  let tT; function toast(m){ $('toastMsg').textContent=m; $('toast').classList.add('show');
    clearTimeout(tT); tT=setTimeout(()=>$('toast').classList.remove('show'),3000); }

  const DAYS_SHORT=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  /* Статус «О» выведен из системы. */
  const STATUSES=[['Н','Не был'],['У','Неуважительная'],['Б','Больничный']];
  const pad=n=>String(n).padStart(2,'0');
  const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);x.setHours(0,0,0,0);return x;};
  const startOfWeek=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
  const sameDay=(a,b)=>keyOf(a)===keyOf(b);

  await CollegeDB.init();
  if(CollegeDB.startSync) CollegeDB.startSync(20000);
  const R=r=>CollegeDB.normRole?CollegeDB.normRole(r):'student';
  const FK=s=>CollegeDB.fioKey?CollegeDB.fioKey(s):String(s||'').toLowerCase();

  const s=CollegeDB.session();
  let me=(s&&CollegeDB.findByLogin(s.login))||null;
  if(s&&CollegeDB.me){ try{ const f=await CollegeDB.me(); if(f) me=f; }catch(e){} }
  /* Мультироли: приоритет dev → teacher → curator/prefect/deputy. */
  const myRoles=CollegeDB.rolesOf?CollegeDB.rolesOf(me):[R(me&&me.role)];
  const role=myRoles.indexOf('dev')>-1?'dev'
    :myRoles.indexOf('teacher')>-1?'teacher'
    :myRoles.indexOf('curator')>-1?'curator'
    :myRoles.indexOf('prefect')>-1?'prefect'
    :myRoles.indexOf('deputy')>-1?'deputy':'student';

  /* Полный набор предметов группы видят куратор, староста, заместитель
     и разработчик — даже если среди ролей есть ещё «преподаватель».
     Чистый преподаватель видит только предметы, которые ведёт сам. */
  const seeAll=myRoles.some(r=>['dev','curator','prefect','deputy'].indexOf(r)>-1);

  if(['teacher','dev','curator','prefect','deputy'].indexOf(role)<0){
    $('denied').classList.remove('hidden'); lucide.createIcons(); return;
  }

  function shortFio(f){
    const p=String(f||'').trim().split(/\s+/);
    return p.length>2?(p[0]+' '+p[1][0]+'.'+p[2][0]+'.'):(p[0]||'');
  }

  const MY_KEY=FK(me&&me.fio);

  /* Преподаватель: только свои пары. Куратор/староста/зам: всё расписание группы. */
  let ALL=await (seeAll
    ? Promise.resolve({})
    : (CollegeDB.loadTeachingSchedules?CollegeDB.loadTeachingSchedules():Promise.resolve({})));
  function myGroups(){
    const out=[];
    Object.keys(ALL).forEach(g=>{
      const days=ALL[g]||{};
      const has=Object.keys(days).some(d=>(days[d]||[]).some(L=>!L.event&&FK(L.teacher)===MY_KEY));
      if(has) out.push(g);
    });
    return out;
  }
  /* Для полной статистики группы берём свою группу, а не группы по расписанию. */
  let groups=seeAll
    ? (me.group?[me.group]:[])
    : myGroups();
  if(role==='dev'&&!groups.length) groups=(CollegeDB.listGroups()||[]).map(g=>g.code);

  /* куратор без пар в расписании — журнал закрыт */
  if(role==='curator'&&!groups.length){
    $('denied').classList.remove('hidden');
    $('deniedMsg').innerHTML='В расписании нет занятий с вашим ФИО, поэтому журнал преподавателя недоступен.'
      +'<br><br>Если вы ведёте пары, попросите старосту указать преподавателя как '
      +'<span class="mono text-white/70">'+shortFio(me&&me.fio)+'</span> — журнал откроется автоматически.'
      +'<br><br>Журнал куратора при этом доступен как обычно.';
    lucide.createIcons(); return;
  }

  $('app').classList.remove('hidden');
  $('myFio').textContent=(me&&me.fio)||'—';
  if(role==='curator') $('rolePill') && ($('rolePill').textContent='КУРАТОР · ПРЕПОДАВАТЕЛЬ');

  if(!groups.length){
    $('groupSelect').innerHTML='<option>Пар не найдено</option>';
    $('groupHint').innerHTML='В расписании нет пар с преподавателем «'+((me&&me.fio)||'')+'».<br>'
      +'Проверьте, что староста указал вас как <span class="mono">'+shortFio(me&&me.fio)+'</span>';
    lucide.createIcons();
  }

  let GROUP=groups[0]||'';
  if(GROUP&&CollegeDB.loadGroupUsers) await CollegeDB.loadGroupUsers(GROUP);
  /* Полная статистика группы требует всего расписания группы,
     а не только пар, которые ведёт текущий пользователь. */
  if(seeAll&&GROUP&&CollegeDB.loadSchedule) ALL=await CollegeDB.loadSchedule(GROUP);
  $('groupSelect').innerHTML=groups.map(g=>'<option value="'+g+'">'+g+'</option>').join('')
    ||'<option value="">—</option>';
  if(groups.length) $('groupHint').textContent='Ваши пары найдены в группах: '+groups.join(', ');

  let attendance=GROUP?await CollegeDB.loadAttendance(GROUP):{};
  let weekStart=startOfWeek(new Date());
  let selected=new Date(); selected.setHours(0,0,0,0);
  let picked=null;

  $('groupSelect').addEventListener('change',async e=>{
    GROUP=e.target.value; picked=null;
    if(GROUP&&CollegeDB.loadGroupUsers) await CollegeDB.loadGroupUsers(GROUP);
    attendance=GROUP?await CollegeDB.loadAttendance(GROUP):{};
    if(seeAll&&GROUP&&CollegeDB.loadSchedule) ALL=await CollegeDB.loadSchedule(GROUP);
    renderWeek(); renderDay();
    if(typeof renderStudents==='function') renderStudents();
  });

  /* ---- пары дня: для полной статистики — все, иначе только свои ---- */
  function myLessons(date){
    const list=((ALL[GROUP]||{})[keyOf(date)]||[]);
    const day=list.filter(L=>!L.event);
    const visible=seeAll?day:day.filter(L=>FK(L.teacher)===MY_KEY);
    return visible.sort((a,b)=>(a.slot||0)-(b.slot||0));
  }
  function students(){
    return CollegeDB.all().filter(x=>x.group===GROUP&&['student','prefect'].indexOf(R(x.role))>-1)
      .sort((a,b)=>String(a.fio||a.login).localeCompare(String(b.fio||b.login),'ru'));
  }
  function att(){ const k=keyOf(selected); attendance[k]=attendance[k]||{}; return attendance[k]; }
  function rec(login,slot){
    const a=att(); a[login]=a[login]||{};
    a[login][slot]=a[login][slot]||{st:'',g:[]};
    return a[login][slot];
  }

  function renderWeek(){
    const last=addDays(weekStart,6), today=new Date();
    const ml=weekStart.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
    $('wLabel').textContent=ml.charAt(0).toUpperCase()+ml.slice(1);
    $('wRange').textContent=weekStart.getDate()+' — '+last.getDate()+' '+
      last.toLocaleDateString('ru-RU',{month:'short'}).replace('.','').toUpperCase();
    let html='';
    for(let i=0;i<7;i++){
      const d=addDays(weekStart,i), n=myLessons(d).length;
      html+='<button type="button" class="day'+(sameDay(d,selected)?' sel':'')+(sameDay(d,today)?' today':'')
        +'" data-key="'+keyOf(d)+'"><span class="dw">'+DAYS_SHORT[i]+'</span>'
        +'<span class="dn">'+d.getDate()+'</span><span class="dd'+(n?'':' off')+'"></span></button>';
    }
    $('weekDays').innerHTML=html;
    $('weekDays').querySelectorAll('.day').forEach(b=>b.addEventListener('click',()=>{
      const p=b.dataset.key.split('-');
      selected=new Date(+p[0],+p[1]-1,+p[2]); picked=null;
      renderWeek(); renderDay();
    }));
  }
  $('wPrev').addEventListener('click',()=>{ weekStart=addDays(weekStart,-7); selected=addDays(selected,-7); picked=null; renderWeek(); renderDay(); });
  $('wNext').addEventListener('click',()=>{ weekStart=addDays(weekStart,7); selected=addDays(selected,7); picked=null; renderWeek(); renderDay(); });

  function renderDay(){
    const t=selected.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
    $('dayTitle').textContent=t.charAt(0).toUpperCase()+t.slice(1);
    const list=myLessons(selected);
    if(!list.length){
      $('lessons').innerHTML='<div class="dbox">В этот день у вас нет пар в группе '+(GROUP||'—')+'</div>';
      $('marksCard').classList.add('hidden'); return;
    }
    $('lessons').innerHTML=list.map(L=>
      '<button type="button" class="les'+(picked===L.slot?' on':'')+'" data-slot="'+L.slot+'">'
      +'<span class="les-n">'+L.slot+'</span>'
      +'<span class="min-w-0 flex-1"><span class="block text-[13.5px] font-semibold truncate">'+L.name+'</span>'
      +'<span class="block text-[11px] text-white/35 mt-0.5 truncate">'+(L.start||'')+'–'+(L.end||'')
      +(L.room?(' · каб. '+L.room):'')+' · '+(L.type||'')+'</span></span>'
      +'<i data-lucide="chevron-right" class="w-4 h-4 text-white/30"></i></button>').join('');
    lucide.createIcons();
    $('lessons').querySelectorAll('.les').forEach(b=>b.addEventListener('click',()=>{
      picked=Number(b.dataset.slot); renderDay(); renderMarks();
    }));
    if(picked!==null) renderMarks(); else $('marksCard').classList.add('hidden');
  }

  function renderMarks(){
    const L=myLessons(selected).find(x=>x.slot===picked);
    if(!L){ $('marksCard').classList.add('hidden'); return; }
    $('marksCard').classList.remove('hidden');
    $('lesTitle').textContent=L.name;
    $('lesMeta').textContent=L.slot+' пара · '+(L.start||'')+'–'+(L.end||'');
    /* домашнее задание выбранной пары */
    $('hwText').value=L.hw||'';
    $('hwMeta').textContent=L.hw
      ? ('задано'+(L.hwBy?(' · '+L.hwBy):'')+(L.hwAt?(' · '+new Date(L.hwAt)
          .toLocaleDateString('ru-RU',{day:'numeric',month:'short'})):''))
      : 'не задано';

    const list=students();
    if(!list.length){
      $('marksList').innerHTML='<div class="dbox">В группе '+GROUP+' нет студентов</div>';
      $('statCards').innerHTML=''; return;
    }
    let present=0, gSum=0, gCnt=0;
    list.forEach(u=>{
      const r=(att()[u.login]||{})[picked]||{};
      if(!r.st) present++;
      (r.g||[]).forEach(g=>{ gSum+=g; gCnt++; });
    });
    $('statCards').innerHTML=
       '<div class="scard"><p class="k">На паре</p><p class="v text-emerald-300">'+present+' / '+list.length+'</p></div>'
      +'<div class="scard"><p class="k">Отсутствуют</p><p class="v text-rose-300">'+(list.length-present)+'</p></div>'
      +'<div class="scard"><p class="k">Оценок</p><p class="v">'+gCnt+'</p></div>'
      +'<div class="scard"><p class="k">Средний балл</p><p class="v text-indigo-300">'+(gCnt?(gSum/gCnt).toFixed(2):'—')+'</p></div>';

    $('marksList').innerHTML=list.map(u=>{
      const r=(att()[u.login]||{})[picked]||{st:'',g:[]};
      return '<div class="stu clickable'+(r.st?' absent':' ok')+'" data-login="'+u.login+'">'
        +'<span class="min-w-0 flex-1 stu-name"><span class="block text-[13.5px] font-semibold truncate">'+(u.fio||u.login)+'</span>'
        +'<span class="block text-[11px] text-white/35 mono mt-0.5">'+u.login+' · нажмите для статистики</span></span>'
        +'<span class="flex gap-1.5 shrink-0">'
          +STATUSES.map(st=>'<button type="button" class="sb s'+st[0]+(r.st===st[0]?' on':'')
            +'" data-st="'+st[0]+'" data-login="'+u.login+'" title="'+st[1]+'">'+st[0]+'</button>').join('')
        +'</span>'
        +'<span class="gwrap shrink-0 border-l border-white/10 pl-2.5" data-login="'+u.login+'">'
          +(r.g||[]).map((g,gi)=>'<button type="button" class="gch m'+g+'" data-login="'+u.login+'" data-gi="'+gi+'" title="Убрать">'+g+'</button>').join('')
          +'<button type="button" class="gadd" data-login="'+u.login+'" title="Добавить оценку">+</button>'
          +'<span class="gpick hidden" data-login="'+u.login+'">'
            +[5,4,3,2].map(g=>'<button type="button" class="gp m'+g+'" data-g="'+g+'" data-login="'+u.login+'">'+g+'</button>').join('')
          +'</span></span>'
        +'</div>';
    }).join('');

    $('marksList').querySelectorAll('.sb').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      const r=rec(b.dataset.login,picked);
      r.st=(r.st===b.dataset.st)?'':b.dataset.st;
      renderMarks();
    }));
    $('marksList').querySelectorAll('.gadd').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      const p=$('marksList').querySelector('.gpick[data-login="'+b.dataset.login+'"]');
      $('marksList').querySelectorAll('.gpick').forEach(x=>{ if(x!==p) x.classList.add('hidden'); });
      if(p) p.classList.toggle('hidden');
    }));
    $('marksList').querySelectorAll('.gp').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      const r=rec(b.dataset.login,picked);
      r.g=r.g||[]; r.g.push(Number(b.dataset.g));
      renderMarks();
      const p=$('marksList').querySelector('.gpick[data-login="'+b.dataset.login+'"]');
      if(p) p.classList.remove('hidden');
    }));
    $('marksList').querySelectorAll('.gch').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      const r=rec(b.dataset.login,picked);
      (r.g||[]).splice(Number(b.dataset.gi),1);
      renderMarks();
    }));
    $('marksList').querySelectorAll('.stu-name').forEach(n=>
      n.addEventListener('click',()=>openStudent(n.closest('.stu').dataset.login)));
  }

  /* ---- выдача домашнего задания на свою пару ---- */
  async function saveHomework(text){
    if(picked===null) return toast('Сначала выберите пару');
    const btn=$('hwSave'); btn.disabled=true; btn.style.opacity='.6';
    try{
      await CollegeDB.setHomework(GROUP,keyOf(selected),String(picked),text);
      /* обновляем локальную копию, чтобы сразу увидеть результат */
      const day=((ALL[GROUP]||{})[keyOf(selected)]||[]);
      const L=day.find(x=>String(x.slot)===String(picked));
      if(L){ L.hw=text; L.hwBy='вы'; L.hwAt=new Date().toISOString(); }
      renderMarks();
      toast(text?'Задание выдано группе '+GROUP:'Задание убрано');
    }catch(err){
      toast(err&&err.status===403?'Можно выдавать задание только на свои пары'
        :'Ошибка: '+((err&&err.message)||'нет связи'));
    }
    btn.disabled=false; btn.style.opacity='';
  }
  $('hwSave').addEventListener('click',()=>{
    const t=$('hwText').value.trim();
    if(!t) return toast('Введите текст задания');
    saveHomework(t);
  });
  $('hwClear').addEventListener('click',()=>{
    if(!confirm('Убрать домашнее задание с этой пары?')) return;
    $('hwText').value=''; saveHomework('');
  });

  $('saveMarks').addEventListener('click',()=>{
    if(!GROUP) return toast('Группа не выбрана');
    const btn=$('saveMarks'); btn.disabled=true; btn.style.opacity='.6';
    CollegeDB.saveAttendance(GROUP,attendance).then(()=>{
      btn.disabled=false; btn.style.opacity='';
      toast('Журнал сохранён — оценки видны студентам');
    }).catch(err=>{
      btn.disabled=false; btn.style.opacity='';
      toast(err&&err.status===403?'Можно вести журнал только своих пар'
        :'Ошибка: '+((err&&err.message)||'нет связи'));
    });
  });

  /* ================== ВКЛАДКИ ================== */
  const tabInd=$('tabInd');
  function moveInd(){
    const a=document.querySelector('.tab.on'); if(!a)return;
    tabInd.style.left=a.offsetLeft+'px'; tabInd.style.width=a.offsetWidth+'px';
  }
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    $('pane-lessons').classList.toggle('hidden',t.dataset.tab!=='lessons');
    $('pane-students').classList.toggle('hidden',t.dataset.tab!=='students');
    moveInd();
    if(t.dataset.tab==='students') renderStudents();
  }));
  moveInd(); setTimeout(moveInd,300); addEventListener('resize',moveInd);

  /* ================== СТАТИСТИКА ПО УЧЕНИКАМ ==================
     Преподаватель видит только свои предметы в выбранной группе. */
  const ini=f=>{const p=String(f||'?').trim().split(/\s+/);return(((p[0]||'')[0]||'')+((p[1]||'')[0]||'')).toUpperCase();};
  const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function official(avg){
    if(!avg) return {mark:0,word:'Нет оценок',cls:''};
    if(avg>=4.5) return {mark:5,word:'Отлично',cls:'m5'};
    if(avg>=3.5) return {mark:4,word:'Хорошо',cls:'m4'};
    if(avg>=2.5) return {mark:3,word:'Удовлетворительно',cls:'m3'};
    return {mark:2,word:'Неудовлетворительно',cls:'m2'};
  }

  /* Все предметы этого преподавателя в группе + показатели ученика */
  function studentStats(login){
    const days=(ALL[GROUP]||{});
    const map={};
    Object.keys(days).sort().forEach(date=>{
      (days[date]||[]).forEach(L=>{
        if(L.event||!L.name) return;
        /* ALL уже содержит только пары этого преподавателя */
        const s=map[L.name]=map[L.name]||{name:L.name,lessons:0,grades:[],marks:[],
          st:{'Н':0,'У':0,'Б':0},history:[]};
        s.lessons++;
        const r=((attendance[date]||{})[login]||{})[String(L.slot)]||{};
        if(r.st) s.st[r.st]=(s.st[r.st]||0)+1;
        const gs=(r.g||[]).map(Number).filter(n=>n>=2&&n<=5);
        gs.forEach(g=>{ s.grades.push(g); s.marks.push({v:g,date:date}); });
        if(r.st||gs.length) s.history.push({date:date,slot:L.slot,st:r.st||'',g:gs});
      });
    });
    const subjects=Object.keys(map).map(k=>{
      const s=map[k];
      s.avg=s.grades.length?s.grades.reduce((a,b)=>a+b,0)/s.grades.length:0;
      s.official=official(s.avg);
      s.absent=s.st['Н']+s.st['У'];
      s.attendance=s.lessons?Math.round((s.lessons-s.absent)/s.lessons*100):100;
      return s;
    }).sort((a,b)=>b.lessons-a.lessons);

    const allG=subjects.reduce((a,s)=>a.concat(s.grades),[]);
    const lessons=subjects.reduce((a,s)=>a+s.lessons,0);
    const absent=subjects.reduce((a,s)=>a+s.absent,0);
    const avg=allG.length?allG.reduce((a,b)=>a+b,0)/allG.length:0;
    return {
      subjects:subjects, grades:allG, avg:avg, official:official(avg),
      lessons:lessons, absent:absent,
      attendance:lessons?Math.round((lessons-absent)/lessons*100):100
    };
  }

  let stuFilter='', stuT=0;
  /* Поиск считает статистику каждого ученика — пересчитываем не на каждую
     букву, а через паузу после ввода. */
  $('stuSearch').addEventListener('input',e=>{
    stuFilter=e.target.value;
    clearTimeout(stuT);
    stuT=setTimeout(renderStudents,220);
  });

  /* Подсказка отражает объём данных: свои предметы или вся группа. */
  $('studentsHint').textContent=seeAll
    ? 'Нажмите на ученика, чтобы открыть статистику по всем предметам группы.'
    : 'Нажмите на ученика, чтобы открыть статистику только по предметам, которые ведёте вы.';

  function renderStudents(){
    const q=stuFilter.trim().toLowerCase();
    const all=students().filter(u=>!q
      || String(u.fio||'').toLowerCase().indexOf(q)>-1
      || String(u.login||'').toLowerCase().indexOf(q)>-1);
    const rows=all.map(u=>({u:u,st:studentStats(u.login)}));

    const totalG=rows.reduce((a,r)=>a+r.st.grades.length,0);
    const sumG=rows.reduce((a,r)=>a+r.st.grades.reduce((x,y)=>x+y,0),0);
    const avgAtt=rows.length?Math.round(rows.reduce((a,r)=>a+r.st.attendance,0)/rows.length):0;
    $('groupStats').innerHTML=
       '<div class="scard"><p class="k">Учеников</p><p class="v">'+students().length+'</p></div>'
      +'<div class="scard"><p class="k">Средний балл</p><p class="v text-indigo-300">'
        +(totalG?(sumG/totalG).toFixed(2):'—')+'</p></div>'
      +'<div class="scard"><p class="k">Оценок</p><p class="v">'+totalG+'</p></div>'
      +'<div class="scard"><p class="k">Посещаемость</p><p class="v text-emerald-300">'+avgAtt+'%</p></div>';

    if(!rows.length){
      $('studentsList').innerHTML='<div class="dbox">В группе '+(GROUP||'—')+' учеников не найдено</div>';
      return;
    }
    $('studentsList').innerHTML=rows.map(r=>{
      const u=r.u, st=r.st, of=st.official;
      const av=u.avatar?('background-image:url('+u.avatar+')'):'';
      return '<button type="button" class="stu clickable w-full text-left" data-login="'+esc(u.login)+'">'
        +'<span class="ava" style="'+av+'">'+(u.avatar?'':ini(u.fio||u.login))+'</span>'
        +'<span class="min-w-0 flex-1">'
          +'<span class="block text-[13.5px] font-bold truncate">'+esc(u.fio||u.login)+'</span>'
          +'<span class="block text-[11px] text-white/35 mono mt-0.5">@'+esc(u.login)
            +' · посещ. '+st.attendance+'%'+(st.absent?(' · проп. '+st.absent):'')+'</span>'
        +'</span>'
        +(st.grades.length
          ? '<span class="flex items-center gap-2 shrink-0">'
            +'<span class="mono text-[12px] text-white/45">'+st.avg.toFixed(2)+'</span>'
            +'<span class="mk '+of.cls+'">'+of.mark+'</span></span>'
          : '<span class="pill shrink-0">нет оценок</span>')
        +'<i data-lucide="chevron-right" class="w-4 h-4 text-white/25 shrink-0"></i></button>';
    }).join('');
    lucide.createIcons();
    $('studentsList').querySelectorAll('.stu').forEach(b=>
      b.addEventListener('click',()=>openStudent(b.dataset.login)));
  }

  /* ================== КАРТОЧКА УЧЕНИКА ================== */
  function openStudent(login){
    const u=students().find(x=>x.login===login)||CollegeDB.findByLogin(login)||{login:login,fio:login};
    const st=studentStats(login);
    const av=u.avatar?('background-image:url('+u.avatar+')'):'';

    $('stuBody').innerHTML=
       '<div class="flex items-center gap-3 mb-4 pr-8">'
        +'<span class="ava" style="width:48px;height:48px;border-radius:15px;font-size:15px;'+av+'">'
          +(u.avatar?'':ini(u.fio||u.login))+'</span>'
        +'<span class="min-w-0"><span class="mono text-[9.5px] tracking-[.22em] text-indigo-300/70">УЧЕНИК · '+esc(GROUP)+'</span>'
        +'<h3 class="font-display text-[17px] leading-tight truncate mt-0.5" style="font-weight:800">'+esc(u.fio||u.login)+'</h3>'
        +'<span class="mono text-[11px] text-white/35">@'+esc(u.login)+'</span></span>'
      +'</div>'
      +'<div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mb-5">'
        +'<div class="scard"><p class="k">Средний балл</p><p class="v text-indigo-300">'
          +(st.grades.length?st.avg.toFixed(2):'—')+'</p></div>'
        +'<div class="scard"><p class="k">Итог</p><p class="v">'
          +(st.official.mark||'—')+'</p></div>'
        +'<div class="scard"><p class="k">Оценок</p><p class="v">'+st.grades.length+'</p></div>'
        +'<div class="scard"><p class="k">Посещаемость</p><p class="v text-emerald-300">'+st.attendance+'%</p></div>'
      +'</div>'
      +'<p class="lbl">Ваши предметы — нажмите для деталей</p>'
      +(st.subjects.length
        ? '<div class="space-y-2" id="subjPick">'+st.subjects.map((s,i)=>
            '<button type="button" class="subj'+(i===0?' on':'')+'" data-i="'+i+'">'
            +'<span class="min-w-0 flex-1"><span class="block text-[13.5px] font-bold truncate">'+esc(s.name)+'</span>'
            +'<span class="block text-[11px] text-white/40 mt-0.5">занятий: '+s.lessons
              +' · оценок: '+s.grades.length+' · посещ. '+s.attendance+'%</span></span>'
            +(s.grades.length
              ? '<span class="flex items-center gap-1.5 shrink-0">'
                +'<span class="mono text-[11.5px] text-white/45">'+s.avg.toFixed(2)+'</span>'
                +'<span class="mk '+s.official.cls+'">'+s.official.mark+'</span></span>'
              : '<span class="pill shrink-0">нет оценок</span>')
            +'</button>').join('')+'</div>'
        : '<div class="dbox">В расписании группы пока нет ваших пар</div>')
      +'<div id="subjView" class="mt-4"></div>';

    $('stuModal').classList.remove('hidden');
    lucide.createIcons();

    function drawSubject(s){
      if(!s){ $('subjView').innerHTML=''; return; }
      const of=s.official;
      $('subjView').innerHTML=
         '<div class="panel p-4">'
        +'<div class="flex items-center justify-between gap-2 mb-3 flex-wrap">'
          +'<div><p class="text-[14.5px] font-bold">'+esc(s.name)+'</p>'
          +'<p class="text-[11.5px] text-white/40 mt-0.5">'+of.word
            +(s.grades.length?(' · средний балл '+s.avg.toFixed(2)+' → итоговая «'+of.mark+'»'):'')+'</p></div>'
          +(of.mark?'<span class="mk '+of.cls+'" style="width:36px;height:36px;font-size:16px">'+of.mark+'</span>':'')
        +'</div>'
        +'<p class="lbl">Посещаемость</p>'
        +'<div class="grid grid-cols-4 gap-2 mb-4">'
          +'<div class="scard" style="text-align:center"><p class="v text-emerald-300" style="font-size:18px">'
            +(s.lessons-s.absent-s.st['Б'])+'</p><p class="k" style="margin:4px 0 0">Был</p></div>'
          +STATUSES.map(st=>'<div class="scard" style="text-align:center">'
            +'<p class="v" style="font-size:18px">'+(s.st[st[0]]||0)+'</p>'
            +'<p class="k" style="margin:4px 0 0">'+st[0]+' · '+st[1]+'</p></div>').join('')
        +'</div>'
        +'<p class="lbl">Все оценки по предмету</p>'
        +(s.marks.length
          ? '<div class="flex flex-wrap gap-1.5 mb-4">'+s.marks.map(m=>
              '<span class="mk m'+m.v+'" title="'+new Date(m.date+'T00:00:00')
                .toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+'">'+m.v+'</span>').join('')+'</div>'
          : '<div class="dbox mb-4">Оценок по предмету пока нет</div>')
        +(s.history.length
          ? '<p class="lbl">Журнал по датам</p><div class="space-y-1.5" style="max-height:180px;overflow:auto">'
            +s.history.slice().reverse().map(h=>
              '<div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl" '
              +'style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);font-size:12px">'
              +'<span class="text-white/60">'+new Date(h.date+'T00:00:00')
                .toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+' · '+h.slot+' пара</span>'
              +'<span class="flex items-center gap-1">'
                +(h.st?'<span class="sb on s'+h.st+'" style="width:24px;height:24px;font-size:11px">'+h.st+'</span>':'')
                +h.g.map(g=>'<span class="mk m'+g+'" style="width:24px;height:24px;font-size:11.5px">'+g+'</span>').join('')
              +'</span></div>').join('')+'</div>'
          : '')
        +'</div>';
    }
    drawSubject(st.subjects[0]);

    const box=$('subjPick');
    if(box) box.querySelectorAll('.subj').forEach(b=>b.addEventListener('click',()=>{
      box.querySelectorAll('.subj').forEach(x=>x.classList.toggle('on',x===b));
      drawSubject(st.subjects[+b.dataset.i]);
    }));
  }
  $('stuClose').addEventListener('click',()=>$('stuModal').classList.add('hidden'));
  $('stuModal').querySelector('.m-bg').addEventListener('click',()=>$('stuModal').classList.add('hidden'));
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&!$('stuModal').classList.contains('hidden')){
      e.stopImmediatePropagation(); $('stuModal').classList.add('hidden');
    }
  },true);

  if(CollegeDB.onSync) CollegeDB.onSync(()=>{
    if(GROUP&&CollegeDB.loadGroupUsers) CollegeDB.loadGroupUsers(GROUP)
      .then(()=>{ if(picked!==null) renderMarks(); if(!$('pane-students').classList.contains('hidden')) renderStudents(); });
    if(CollegeDB.loadTeachingSchedules) CollegeDB.loadTeachingSchedules().then(d=>{ ALL=d||{}; renderWeek(); renderDay(); });
    if(GROUP) CollegeDB.loadAttendance(GROUP).then(d=>{ attendance=d; if(picked!==null) renderMarks(); });
  });

  renderWeek(); renderDay();
})();
</script>
</body>
</html>
