<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пульт поддержки — Колледж·ID</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2306b6d4'/%3E%3Cstop offset='1' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/General/boot.css?v=1">
<script defer src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"
  onload="setTimeout(function(){document.documentElement.classList.add('tw-ready')},150)"
  onerror="document.documentElement.classList.add('tw-ready')"></script>
<script>setTimeout(function(){document.documentElement.classList.add('tw-ready')},3000)</script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark}
  body{font-family:'Manrope',sans-serif;background:#07070d}
  .font-display{font-family:'Unbounded',sans-serif}
  .mono{font-family:'JetBrains Mono',monospace}
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
  svg{flex:none;display:block}
  html,body{overflow-x:clip}

  .orb{position:fixed;border-radius:9999px;filter:blur(90px);pointer-events:none}
  .o1{width:520px;height:520px;top:-170px;left:-150px;background:radial-gradient(circle,rgba(6,182,212,.22),transparent 65%)}
  .o2{width:460px;height:460px;bottom:-170px;right:-130px;background:radial-gradient(circle,rgba(99,102,241,.2),transparent 65%)}

  .card{background:rgba(13,13,21,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.08);box-shadow:0 40px 90px -30px rgba(0,0,0,.7)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:9999px;
    font-size:11px;font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
  .back{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:13px;font-size:13px;font-weight:700;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.75);
    cursor:pointer;transition:background .22s}
  .back:hover{background:rgba(255,255,255,.1);color:#fff}

  .wrap{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
  @media(max-width:860px){.wrap{grid-template-columns:1fr}
    .chatcol.hide-m{display:none} .listcol.hide-m{display:none}}

  #chats{max-height:min(70vh,640px);overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:8px}
  .chat{display:flex;gap:10px;padding:11px 12px;border-radius:15px;cursor:pointer;text-align:left;width:100%;
    background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);transition:all .2s}
  .chat:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
  .chat.on{background:linear-gradient(100deg,rgba(6,182,212,.16),rgba(99,102,241,.1));border-color:rgba(34,211,238,.5)}
  .ava{width:36px;height:36px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:12px;background:linear-gradient(135deg,#0891b2,#4f46e5);color:#fff}
  .badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#f43f5e;color:#fff;
    font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}

  #feed{height:min(56vh,520px);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:84%;display:flex;flex-direction:column;gap:5px;animation:pop .3s cubic-bezier(.22,1,.36,1)}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  html.lite .msg{animation:none}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .msg.them{align-self:flex-start}
  .bub{padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
  .msg.me .bub{background:linear-gradient(120deg,#0891b2,#4f46e5);color:#fff;border-bottom-right-radius:6px}
  .msg.them .bub{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);
    color:rgba(255,255,255,.88);border-bottom-left-radius:6px}
  .meta{font-size:10px;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.28);padding:0 4px}
  .shot{max-width:min(300px,64vw);border-radius:14px;cursor:zoom-in;border:1px solid rgba(255,255,255,.12);display:block}
  .daysep{align-self:center;font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.15em;
    text-transform:uppercase;color:rgba(255,255,255,.3);background:rgba(255,255,255,.04);
    padding:4px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.07)}

  .composer{border-top:1px solid rgba(255,255,255,.08);padding:12px;display:flex;gap:9px;align-items:flex-end}
  #input{flex:1;min-height:44px;max-height:140px;resize:none;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;font-size:14px;color:#fff;
    outline:none;font-family:inherit;line-height:1.5}
  #input:focus{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 4px rgba(6,182,212,.12)}
  .icbtn{width:44px;height:44px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .2s;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.6)}
  .icbtn:hover{background:rgba(255,255,255,.1);color:#fff}
  .send{background:linear-gradient(120deg,#0891b2,#4f46e5);border-color:transparent;color:#fff}
  .send:disabled{opacity:.45;cursor:not-allowed}
  #preview{display:none;padding:10px 12px 0;gap:8px;flex-wrap:wrap}
  #preview.on{display:flex}
  .pv{position:relative}.pv img{height:60px;border-radius:10px;border:1px solid rgba(255,255,255,.14)}
  .pv button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:99px;cursor:pointer;
    background:#f43f5e;border:0;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
  .empty{text-align:center;padding:40px 20px;color:rgba(255,255,255,.4);font-size:13.5px;line-height:1.6}

  #lightbox{position:fixed;inset:0;z-index:300;background:rgba(5,5,10,.94);display:none;
    align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  #lightbox.on{display:flex}
  #lightbox img{max-width:100%;max-height:92vh;border-radius:16px}

  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;transition:.3s;z-index:99;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body class="text-white antialiased min-h-screen">

  <div class="orb o1"></div><div class="orb o2"></div>

  <div class="relative max-w-[1100px] mx-auto px-5 sm:px-8 py-7 pb-16" style="z-index:10">

    <header class="flex items-center justify-between gap-3 mb-6">
      <button id="btnBack" class="back"><i data-lucide="arrow-left" class="w-4 h-4"></i>Приложения</button>
      <span class="pill"><i data-lucide="headset" class="w-3.5 h-3.5 text-cyan-300"></i>ПУЛЬТ ПОДДЕРЖКИ</span>
    </header>

    <div id="denied" class="hidden">
      <div class="card rounded-[24px] p-8 text-center">
        <span class="w-16 h-16 mx-auto mb-5 rounded-[20px] bg-rose-500/15 border border-rose-400/30 flex items-center justify-center">
          <i data-lucide="lock" class="w-7 h-7 text-rose-300"></i></span>
        <h1 class="font-display text-xl mb-2" style="font-weight:800">Доступ ограничен</h1>
        <p class="text-white/45 text-[13.5px] mb-6">Пульт доступен роли «Оператор поддержки».</p>
        <button id="btnBack3" class="back mx-auto"><i data-lucide="arrow-left" class="w-4 h-4"></i>Вернуться</button>
      </div>
    </div>

    <div id="app" class="hidden wrap">
      <div class="listcol card rounded-[22px] overflow-hidden">
        <div class="flex items-center justify-between gap-2 p-4 border-b border-white/[.07]">
          <p class="font-bold text-[14px]">Обращения</p>
          <span class="pill" id="chatsCnt">—</span>
        </div>
        <div id="chats"></div>
      </div>

      <div class="chatcol card rounded-[22px] overflow-hidden">
        <div class="flex items-center gap-3 p-4 border-b border-white/[.07]">
          <button id="toList" class="icbtn sm:hidden" style="width:36px;height:36px"><i data-lucide="arrow-left" class="w-4 h-4"></i></button>
          <span class="ava" id="curAva">—</span>
          <div class="min-w-0 flex-1">
            <p class="font-bold text-[14.5px] truncate" id="curName">Выберите чат</p>
            <p class="text-[11.5px] text-white/40 mono truncate" id="curMeta">—</p>
          </div>
        </div>
        <div id="feed"><div class="empty">Выберите обращение слева, чтобы начать переписку</div></div>
        <div id="preview"></div>
        <div class="composer">
          <label class="icbtn" title="Прикрепить изображение">
            <i data-lucide="image-plus" class="w-5 h-5"></i>
            <input type="file" id="file" accept="image/*" multiple style="display:none">
          </label>
          <textarea id="input" rows="1" placeholder="Ответ пользователю…" disabled></textarea>
          <button class="icbtn send" id="send" disabled><i data-lucide="send" class="w-5 h-5"></i></button>
        </div>
      </div>
    </div>

    <button id="btnBack2" class="back w-full justify-center mt-6"><i data-lucide="arrow-left" class="w-4 h-4"></i>Вернуться в приложения</button>
  </div>

  <div id="lightbox"><img id="lbImg" alt=""></div>
  <div id="toast">
    <div class="flex items-center gap-2.5 bg-[#15151f]/95 border border-white/10 rounded-full px-5 py-3 shadow-2xl backdrop-blur">
      <i data-lucide="info" class="w-4 h-4 text-cyan-300"></i><span id="toastMsg" class="text-sm text-white/80"></span>
    </div>
  </div>

  <script src="../General/theme.js?v=2"></script>
  <script src="../Data/users.js?v=20260304-awards1"></script>
  <script src="../General/badges.js?v=1"></script>
  <script src="../General/notify.js?v=1"></script>
  <script src="../General/notice.js?v=1"></script>
  <script src="../General/perf.js"></script>
  <script src="../General/pwa.js?v=1"></script>
<script>
(async function(){
  lucide.createIcons();
  const $=id=>document.getElementById(id);
  const goBack=()=>{ location.href='../Students/diary.html?view=apps'; };
  ['btnBack','btnBack2','btnBack3'].forEach(i=>{const b=$(i); if(b) b.addEventListener('click',goBack);});
  let tT; function toast(m){ $('toastMsg').textContent=m; $('toast').classList.add('show');
    clearTimeout(tT); tT=setTimeout(()=>$('toast').classList.remove('show'),2800); }

  await CollegeDB.init();
  const R=r=>CollegeDB.normRole?CollegeDB.normRole(r):'student';
  const s=CollegeDB.session();
  let me=(s&&CollegeDB.findByLogin(s.login))||null;
  if(s&&CollegeDB.me){ try{ const f=await CollegeDB.me(); if(f) me=f; }catch(e){} }
  if(['support','dev'].indexOf(R(me&&me.role))<0){
    $('denied').classList.remove('hidden'); lucide.createIcons(); return;
  }
  $('app').classList.remove('hidden');

  let chats=[], cur=null, msgs=[], ver=-1, attach=[], badgeCat=[];
  /* каталог значков: показываем награды собеседников в списке чатов */
  if(CollegeDB.loadBadgeCatalog) CollegeDB.loadBadgeCatalog().then(c=>{ badgeCat=c||[]; renderChats(); });
  function badgesFor(login){
    const u=CollegeDB.findByLogin?CollegeDB.findByLogin(login):null;
    const ids=(u&&u.badges)||[];
    return ids.map(id=>badgeCat.find(b=>b.id===id)).filter(Boolean);
  }
  const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tm=iso=>new Date(iso).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const dkey=iso=>new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const ini=f=>{const p=String(f||'?').trim().split(/\s+/);return((p[0]||'')[0]||'')+((p[1]||'')[0]||'');};

  function renderChats(){
    $('chatsCnt').textContent=chats.length+' чат.';
    if(!chats.length){ $('chats').innerHTML='<div class="empty">Обращений пока нет</div>'; return; }
    $('chats').innerHTML=chats.map(c=>
      '<button class="chat'+(cur===c.login?' on':'')+'" data-login="'+c.login+'">'
      +'<span class="ava">'+esc(ini(c.fio).toUpperCase())+'</span>'
      +'<span class="min-w-0 flex-1">'
        +'<span class="flex items-center gap-1.5"><span class="text-[13.5px] font-semibold truncate">'+esc(c.fio)+'</span>'
        +(window.CollegeBadges?CollegeBadges.html(badgesFor(c.login),'sm'):'')
        +(c.unread?'<span class="badge ml-auto">'+c.unread+'</span>':'')+'</span>'
        +'<span class="block text-[11.5px] text-white/40 truncate mt-0.5">'
        +(c.last?((c.last.from==='staff'?'Вы: ':'')+(c.last.image&&!c.last.text?'📷 скриншот':esc(c.last.text))):'нет сообщений')+'</span>'
        +'<span class="block text-[10px] mono text-white/25 mt-1">'+esc(c.login)+(c.group?(' · '+esc(c.group)):'')+'</span>'
      +'</span></button>').join('');
    $('chats').querySelectorAll('.chat').forEach(b=>b.addEventListener('click',()=>open(b.dataset.login)));
  }

  function renderFeed(){
    const feed=$('feed');
    const atBottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<90;
    if(!cur){ feed.innerHTML='<div class="empty">Выберите обращение слева</div>'; return; }
    if(!msgs.length){ feed.innerHTML='<div class="empty">Сообщений пока нет — напишите первым</div>'; return; }
    let html='', last='';
    msgs.forEach(m=>{
      const d=dkey(m.at);
      if(d!==last){ html+='<div class="daysep">'+d+'</div>'; last=d; }
      const mine=m.from==='staff';
      html+='<div class="msg '+(mine?'me':'them')+'">'
        +(m.image?'<img class="shot" src="'+m.image+'" alt="">':'')
        +(m.text?'<div class="bub">'+esc(m.text)+'</div>':'')
        +'<div class="meta">'+(mine?esc(m.author||'Поддержка'):'пользователь')+' · '+tm(m.at)+'</div></div>';
    });
    feed.innerHTML=html;
    feed.querySelectorAll('.shot').forEach(i=>i.addEventListener('click',()=>{
      $('lbImg').src=i.src; $('lightbox').classList.add('on');
    }));
    if(atBottom) feed.scrollTop=feed.scrollHeight;
  }
  $('lightbox').addEventListener('click',()=>$('lightbox').classList.remove('on'));

  async function open(login){
    cur=login;
    const c=chats.find(x=>x.login===login);
    $('curName').innerHTML=esc((c&&c.fio)||login)
      +(window.CollegeBadges?(' '+CollegeBadges.html(badgesFor(login),'sm')):'');
    $('curMeta').textContent=login+((c&&c.group)?(' · '+c.group):'');
    $('curAva').textContent=ini((c&&c.fio)||login).toUpperCase();
    $('input').disabled=false; $('send').disabled=false;
    const d=await CollegeDB.supportChat(login);
    msgs=d.messages||[];
    renderChats(); renderFeed();
    $('feed').scrollTop=$('feed').scrollHeight;
    if(innerWidth<=860){ document.querySelector('.listcol').classList.add('hide-m'); }
  }
  $('toList').addEventListener('click',()=>{
    document.querySelector('.listcol').classList.remove('hide-m');
  });

  async function pull(force){
    const v=await CollegeDB.supportVersion();
    if(v===ver&&!force) return;
    const first=ver===-1;
    ver=v;
    chats=await CollegeDB.supportChats();
    renderChats();
    if(cur){ const d=await CollegeDB.supportChat(cur); msgs=d.messages||[]; renderFeed(); }
    if(!first&&!document.hasFocus()) document.title='● Новое сообщение — Пульт поддержки';
  }
  await pull(true);
  setInterval(()=>pull(false),3000);
  addEventListener('focus',()=>{ document.title='Пульт поддержки — Колледж·ID'; });

  /* вложения */
  function compress(file){
    return new Promise(res=>{
      const fr=new FileReader();
      fr.onload=()=>{ const img=new Image();
        img.onload=()=>{ const max=1280,k=Math.min(1,max/Math.max(img.width,img.height));
          const c=document.createElement('canvas');
          c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          res(c.toDataURL('image/jpeg',0.82)); };
        img.onerror=()=>res(null); img.src=fr.result; };
      fr.onerror=()=>res(null); fr.readAsDataURL(file);
    });
  }
  function drawPreview(){
    const p=$('preview'); p.classList.toggle('on',attach.length>0);
    p.innerHTML=attach.map((src,i)=>'<span class="pv"><img src="'+src+'"><button data-i="'+i+'">✕</button></span>').join('');
    p.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ attach.splice(+b.dataset.i,1); drawPreview(); }));
  }
  $('file').addEventListener('change',async e=>{
    for(const f of [...e.target.files].slice(0,4)){
      if(attach.length>=4) break;
      const d=await compress(f); if(d) attach.push(d);
    }
    drawPreview(); e.target.value='';
  });
  $('input').addEventListener('paste',async e=>{
    for(const it of [...(e.clipboardData&&e.clipboardData.items||[])]){
      if(it.type.indexOf('image')===0){ const d=await compress(it.getAsFile()); if(d){ attach.push(d); drawPreview(); } }
    }
  });

  const input=$('input');
  input.addEventListener('input',()=>{ input.style.height='auto'; input.style.height=Math.min(140,input.scrollHeight)+'px'; });
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
  $('send').addEventListener('click',send);

  async function send(){
    if(!cur) return;
    const text=input.value.trim();
    if(!text&&!attach.length) return;
    $('send').disabled=true;
    const queue=attach.length?attach.slice():[''];
    attach=[]; drawPreview(); input.value=''; input.style.height='auto';
    try{
      for(let i=0;i<queue.length;i++){
        await CollegeDB.supportSend({ to:cur, text:i===0?text:'', image:queue[i]||'' });
      }
      await pull(true);
      $('feed').scrollTop=$('feed').scrollHeight;
    }catch(err){ toast('Не отправлено: '+((err&&err.message)||'нет связи')); }
    $('send').disabled=false;
  }
})();
</script>
</body>
</html>
