<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поддержка — Колледж·ID</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2306b6d4'/%3E%3Cstop offset='1' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark}
  body{font-family:'Manrope',sans-serif;background:#07070d}
  .font-display{font-family:'Unbounded',sans-serif}
  .mono{font-family:'JetBrains Mono',monospace}
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
  svg{flex:none;display:block}
  html,body{overflow-x:clip}

  .orb{position:fixed;border-radius:9999px;filter:blur(90px);pointer-events:none}
  .o1{width:520px;height:520px;top:-170px;left:-150px;background:radial-gradient(circle,rgba(6,182,212,.22),transparent 65%)}
  .o2{width:460px;height:460px;bottom:-170px;right:-130px;background:radial-gradient(circle,rgba(99,102,241,.2),transparent 65%)}

  .card{background:rgba(13,13,21,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.08);box-shadow:0 40px 90px -30px rgba(0,0,0,.7)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:9999px;max-width:100%;
    font-size:11px;font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
  .back{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:13px;font-size:13px;font-weight:700;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.75);
    cursor:pointer;transition:background .22s,transform .18s}
  .back:hover{background:rgba(255,255,255,.1);color:#fff}
  .back:active{transform:scale(.96)}

  /* чат */
  #feed{height:min(58vh,520px);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;
    scroll-behavior:smooth}
  .msg{max-width:84%;display:flex;flex-direction:column;gap:5px;animation:pop .32s cubic-bezier(.22,1,.36,1)}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  html.lite .msg{animation:none}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .msg.them{align-self:flex-start}
  .bub{padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.55;white-space:pre-wrap;
    overflow-wrap:anywhere;word-break:break-word}
  .msg.me .bub{background:linear-gradient(120deg,#0891b2,#4f46e5);color:#fff;border-bottom-right-radius:6px;
    box-shadow:0 10px 26px -10px rgba(8,145,178,.6)}
  .msg.them .bub{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);
    color:rgba(255,255,255,.88);border-bottom-left-radius:6px}
  .meta{font-size:10px;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.28);padding:0 4px}
  .shot{max-width:min(320px,70vw);border-radius:14px;cursor:zoom-in;border:1px solid rgba(255,255,255,.12);display:block}
  .daysep{align-self:center;font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.15em;
    text-transform:uppercase;color:rgba(255,255,255,.3);background:rgba(255,255,255,.04);
    padding:4px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.07)}

  .composer{border-top:1px solid rgba(255,255,255,.08);padding:12px;display:flex;gap:9px;align-items:flex-end}
  #input{flex:1;min-height:44px;max-height:140px;resize:none;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;font-size:14px;color:#fff;
    outline:none;font-family:inherit;line-height:1.5}
  #input:focus{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 4px rgba(6,182,212,.12)}
  .icbtn{width:44px;height:44px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .2s;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
    color:rgba(255,255,255,.6)}
  .icbtn:hover{background:rgba(255,255,255,.1);color:#fff}
  .send{background:linear-gradient(120deg,#0891b2,#4f46e5);border-color:transparent;color:#fff;
    box-shadow:0 10px 26px -10px rgba(8,145,178,.6)}
  .send:hover{filter:brightness(1.12)}
  .send:disabled{opacity:.45;cursor:not-allowed}
  #preview{display:none;padding:10px 12px 0;gap:8px;flex-wrap:wrap}
  #preview.on{display:flex}
  .pv{position:relative}
  .pv img{height:64px;border-radius:10px;border:1px solid rgba(255,255,255,.14)}
  .pv button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:99px;cursor:pointer;
    background:#f43f5e;border:0;color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}

  .empty{text-align:center;padding:40px 20px;color:rgba(255,255,255,.4);font-size:13.5px;line-height:1.6}
  .typing{display:inline-flex;gap:3px}
  .typing i{width:5px;height:5px;border-radius:99px;background:rgba(255,255,255,.5);animation:bl 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

  #lightbox{position:fixed;inset:0;z-index:300;background:rgba(5,5,10,.94);display:none;
    align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  #lightbox.on{display:flex}
  #lightbox img{max-width:100%;max-height:92vh;border-radius:16px}

  .st{opacity:0;animation:rise .55s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(var(--i,0)*70ms + 50ms)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  html.lite .st{animation:none;opacity:1}

  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;transition:.3s;z-index:99;
    pointer-events:none;max-width:calc(100vw - 24px)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body class="text-white antialiased min-h-screen">

  <div class="orb o1"></div><div class="orb o2"></div>

  <div class="relative max-w-[760px] mx-auto px-5 sm:px-8 py-7 pb-16" style="z-index:10">

    <header class="flex items-center justify-between gap-3 mb-6">
      <button id="btnBack" class="back"><i data-lucide="arrow-left" class="w-4 h-4"></i>Приложения</button>
      <span class="pill"><i data-lucide="life-buoy" class="w-3.5 h-3.5 text-cyan-300"></i>ПОДДЕРЖКА</span>
    </header>

    <div class="st card rounded-[24px] overflow-hidden" style="--i:0">
      <div class="flex items-center gap-3 p-4 border-b border-white/[.07]">
        <span class="w-11 h-11 rounded-[14px] bg-gradient-to-br from-cyan-500 to-sky-500 flex items-center justify-center shadow-lg shadow-cyan-600/25">
          <i data-lucide="headset" class="w-5 h-5 text-white"></i>
        </span>
        <div class="min-w-0 flex-1">
          <p class="font-bold text-[15px] leading-tight">Техническая поддержка</p>
          <p class="text-[11.5px] text-white/40 mt-0.5" id="status">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1 align-middle"></span>на связи
          </p>
        </div>
        <span class="pill shrink-0" id="cnt">—</span>
      </div>

      <div id="feed"></div>

      <div id="preview"></div>
      <div class="composer">
        <label class="icbtn" title="Прикрепить скриншот">
          <i data-lucide="image-plus" class="w-5 h-5"></i>
          <input type="file" id="file" accept="image/*" multiple style="display:none">
        </label>
        <textarea id="input" rows="1" placeholder="Опишите вопрос… Shift+Enter — новая строка"></textarea>
        <button class="icbtn send" id="send" title="Отправить"><i data-lucide="send" class="w-5 h-5"></i></button>
      </div>
    </div>

    <div class="st card rounded-[24px] p-5 mt-5" style="--i:1">
      <p class="mono text-[10px] tracking-[.2em] text-white/30 mb-3">КОНТАКТЫ УЧЕБНОЙ ЧАСТИ</p>
      <div class="grid sm:grid-cols-2 gap-2.5 text-[13px]">
        <div class="flex items-center gap-2 text-white/60"><i data-lucide="map-pin" class="w-4 h-4 text-cyan-300"></i>каб. 114, корпус А</div>
        <div class="flex items-center gap-2 text-white/60"><i data-lucide="clock" class="w-4 h-4 text-cyan-300"></i>Пн–Пт, 09:00–17:00</div>
        <div class="flex items-center gap-2 text-white/60"><i data-lucide="phone" class="w-4 h-4 text-cyan-300"></i><span class="mono text-[12px]">+7 (800) 000-00-00</span></div>
        <div class="flex items-center gap-2 text-white/60"><i data-lucide="mail" class="w-4 h-4 text-cyan-300"></i><span class="mono text-[12px]">help@college.id</span></div>
      </div>
    </div>

    <button id="btnBack2" class="back w-full justify-center mt-6"><i data-lucide="arrow-left" class="w-4 h-4"></i>Вернуться в приложения</button>
  </div>

  <div id="lightbox"><img id="lbImg" alt=""></div>

  <div id="toast">
    <div class="flex items-center gap-2.5 bg-[#15151f]/95 border border-white/10 rounded-full px-5 py-3 shadow-2xl backdrop-blur">
      <i data-lucide="info" class="w-4 h-4 text-cyan-300"></i><span id="toastMsg" class="text-sm text-white/80"></span>
    </div>
  </div>

  <script src="../General/theme.js?v=1"></script>
  <script src="../Data/users.js?v=20260302-groups3"></script>
  <script src="../General/notify.js?v=1"></script>
  <script src="../General/notice.js?v=1"></script>
  <script src="../General/perf.js"></script>
  <script src="../General/pwa.js?v=1"></script>
<script>
(async function(){
  lucide.createIcons();
  const $=id=>document.getElementById(id);
  const goBack=()=>{ location.href='diary.html?view=apps'; };
  $('btnBack').addEventListener('click',goBack);
  $('btnBack2').addEventListener('click',goBack);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('lightbox').classList.contains('on')) goBack(); });
  let tT; function toast(m){ $('toastMsg').textContent=m; $('toast').classList.add('show');
    clearTimeout(tT); tT=setTimeout(()=>$('toast').classList.remove('show'),2800); }

  await CollegeDB.init();
  const s=CollegeDB.session();
  if(!s){ $('feed').innerHTML='<div class="empty">Войдите в систему, чтобы написать в поддержку.</div>'; return; }
  if(!CollegeDB.isServer||!CollegeDB.isServer()){
    $('feed').innerHTML='<div class="empty">Чат поддержки доступен только при подключении к серверу.</div>';
    return;
  }

  let msgs=[], ver=-1, attach=[];
  const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const dkey=iso=>new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const tm=iso=>new Date(iso).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});

  function render(){
    const feed=$('feed');
    const atBottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<90;
    if(!msgs.length){
      feed.innerHTML='<div class="empty"><b class="block text-white/70 mb-2">Здравствуйте!</b>'
        +'Опишите вопрос или проблему — оператор поддержки ответит здесь.<br>'
        +'Можно прикреплять скриншоты.</div>';
      $('cnt').textContent='новый чат'; return;
    }
    let html='', lastDay='';
    msgs.forEach(m=>{
      const d=dkey(m.at);
      if(d!==lastDay){ html+='<div class="daysep">'+d+'</div>'; lastDay=d; }
      const mine=m.from==='user';
      html+='<div class="msg '+(mine?'me':'them')+'">'
        +(m.image?'<img class="shot" src="'+m.image+'" alt="скриншот">':'')
        +(m.text?'<div class="bub">'+esc(m.text)+'</div>':'')
        +'<div class="meta">'+(mine?'вы':esc(m.author||'Поддержка'))+' · '+tm(m.at)+'</div></div>';
    });
    feed.innerHTML=html;
    $('cnt').textContent=msgs.length+' сообщ.';
    feed.querySelectorAll('.shot').forEach(img=>img.addEventListener('click',()=>{
      $('lbImg').src=img.src; $('lightbox').classList.add('on');
    }));
    if(atBottom) feed.scrollTop=feed.scrollHeight;
  }
  $('lightbox').addEventListener('click',()=>$('lightbox').classList.remove('on'));

  async function pull(force){
    const v=await CollegeDB.supportVersion();
    if(v===ver&&!force) return;
    ver=v;
    const d=await CollegeDB.supportChat();
    msgs=d.messages||[];
    render();
  }
  await pull(true);
  $('feed').scrollTop=$('feed').scrollHeight;
  /* живое обновление без перезагрузки страницы */
  setInterval(()=>pull(false),3000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pull(true); });

  /* ---- вложения: сжимаем перед отправкой ---- */
  function compress(file){
    return new Promise(res=>{
      const fr=new FileReader();
      fr.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          const max=1280, k=Math.min(1,max/Math.max(img.width,img.height));
          const c=document.createElement('canvas');
          c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          res(c.toDataURL('image/jpeg',0.82));
        };
        img.onerror=()=>res(null);
        img.src=fr.result;
      };
      fr.onerror=()=>res(null);
      fr.readAsDataURL(file);
    });
  }
  function drawPreview(){
    const p=$('preview');
    p.classList.toggle('on',attach.length>0);
    p.innerHTML=attach.map((src,i)=>'<span class="pv"><img src="'+src+'"><button data-i="'+i+'">✕</button></span>').join('');
    p.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      attach.splice(Number(b.dataset.i),1); drawPreview();
    }));
  }
  $('file').addEventListener('change',async e=>{
    const files=[...e.target.files].slice(0,4);
    for(const f of files){
      if(attach.length>=4){ toast('Не больше 4 скриншотов за раз'); break; }
      const d=await compress(f);
      if(d) attach.push(d);
    }
    drawPreview(); e.target.value='';
  });
  /* вставка скриншота из буфера обмена */
  $('input').addEventListener('paste',async e=>{
    const items=[...(e.clipboardData&&e.clipboardData.items||[])];
    for(const it of items){
      if(it.type.indexOf('image')===0){
        const d=await compress(it.getAsFile());
        if(d){ attach.push(d); drawPreview(); toast('Скриншот прикреплён'); }
      }
    }
  });

  /* ---- отправка ---- */
  const input=$('input');
  input.addEventListener('input',()=>{
    input.style.height='auto';
    input.style.height=Math.min(140,input.scrollHeight)+'px';
  });
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }
  });
  $('send').addEventListener('click',send);

  async function send(){
    const text=input.value.trim();
    if(!text&&!attach.length) return;
    const btn=$('send'); btn.disabled=true;
    const queue=attach.length?attach.slice():[''];
    attach=[]; drawPreview(); input.value=''; input.style.height='auto';
    try{
      for(let i=0;i<queue.length;i++){
        await CollegeDB.supportSend({ text:i===0?text:'', image:queue[i]||'' });
      }
      await pull(true);
      $('feed').scrollTop=$('feed').scrollHeight;
    }catch(err){
      toast(err&&err.status===413?'Скриншот слишком большой':'Не отправлено: '+((err&&err.message)||'нет связи'));
    }
    btn.disabled=false;
  }
})();
</script>
</body>
</html>
